name: Release Linux

on:
  push:
    branches: [main]
    paths:
      - 'platform/shared/**'
      - 'platform/linux/**'
      - '.github/workflows/release-linux.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-fold-release-linux
  cancel-in-progress: true

jobs:
  build-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/linux/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk \
            libhidapi-hidraw0 \
            libhidapi-libusb0 \
            libgirepository1.0-dev \
            gir1.2-ayatanaappindicator3-0.1 \
            fuse libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r platform/linux/requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: |
          cd platform/linux
          pyinstaller \
            --onefile \
            --noconsole \
            --name "Mac-Fold-Linux" \
            --add-data "../shared:shared" \
            --hidden-import shared.geometry \
            --hidden-import shared.eye_tracker \
            main.py

      - name: Verify build
        run: test -f platform/linux/dist/Mac-Fold-Linux

      - name: Create AppImage (optional)
        run: |
          set -euo pipefail

          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          # Create AppDir structure
          APPDIR=/tmp/Mac-Fold.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp platform/linux/dist/Mac-Fold-Linux "$APPDIR/usr/bin/mac-fold"
          chmod +x "$APPDIR/usr/bin/mac-fold"

          # Desktop entry
          cat > "$APPDIR/mac-fold.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Mac Fold
          Exec=mac-fold
          Icon=mac-fold
          Categories=Utility;
          Comment=Lid-angle-driven desktop fold effect
          EOF
          cp "$APPDIR/mac-fold.desktop" "$APPDIR/usr/share/applications/"

          # Simple SVG icon (laptop)
          cat > "$APPDIR/mac-fold.svg" <<'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect x="12" y="8" width="40" height="28" rx="3" fill="#444" stroke="#222" stroke-width="2"/>
            <rect x="14" y="10" width="36" height="24" rx="1" fill="#0af"/>
            <path d="M6 40 L58 40 L62 48 L2 48 Z" fill="#555" stroke="#222" stroke-width="1.5"/>
          </svg>
          SVGEOF
          cp "$APPDIR/mac-fold.svg" "$APPDIR/usr/share/icons/hicolor/256x256/apps/"

          # AppRun
          cat > "$APPDIR/AppRun" <<'RUNEOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/mac-fold" "$@"
          RUNEOF
          chmod +x "$APPDIR/AppRun"

          # Build AppImage
          ARCH=x86_64 /tmp/appimagetool --no-appstream "$APPDIR" platform/linux/dist/Mac-Fold-Linux.AppImage || {
            echo "::warning::appimagetool failed; falling back to raw binary"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Fold-Linux
          path: |
            platform/linux/dist/Mac-Fold-Linux
            platform/linux/dist/Mac-Fold-Linux.AppImage
          if-no-files-found: error

      - name: Publish to dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Skipping release upload."
            exit 0
          fi
          # Determine which binary to upload (prefer AppImage)
          if [[ -f platform/linux/dist/Mac-Fold-Linux.AppImage ]]; then
            ASSET=platform/linux/dist/Mac-Fold-Linux.AppImage
            ASSET_NAME=Mac-Fold-Linux.AppImage
          else
            ASSET=platform/linux/dist/Mac-Fold-Linux
            ASSET_NAME=Mac-Fold-Linux
          fi

          if gh release view dev >/dev/null 2>&1; then
            gh release delete-asset dev "$ASSET_NAME" --yes 2>/dev/null || true
            gh release upload dev "$ASSET"
          else
            gh release create dev "$ASSET" \
              --target "$GITHUB_SHA" --title "Mac Fold dev" \
              --prerelease --latest=false \
              --notes "Development build. Download the asset for your platform."
          fi
