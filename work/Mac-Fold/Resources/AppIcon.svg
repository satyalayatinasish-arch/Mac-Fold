<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151C35"/>
      <stop offset="0.52" stop-color="#2A2250"/>
      <stop offset="1" stop-color="#101526"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DE8FF"/>
      <stop offset="0.35" stop-color="#5988FF"/>
      <stop offset="0.72" stop-color="#A149FF"/>
      <stop offset="1" stop-color="#E45CBE"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5D9E5"/>
      <stop offset="0.18" stop-color="#747B91"/>
      <stop offset="0.65" stop-color="#3A4052"/>
      <stop offset="1" stop-color="#171B27"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="28"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><path d="M289 216 L651 421 L466 734 L104 528 Z"/></clipPath>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="216" fill="url(#bg)"/>
  <circle cx="217" cy="222" r="230" fill="#486DDF" opacity=".14" filter="url(#glow)"/>
  <circle cx="815" cy="789" r="260" fill="#C551DB" opacity=".13" filter="url(#glow)"/>

  <!-- Side-view display, folded toward the base around its lower hinge. -->
  <g filter="url(#shadow)">
    <path d="M274 191 L680 421 L478 768 L72 538 Z" fill="#080A12" stroke="#B7BED2" stroke-width="13" stroke-linejoin="round"/>
    <path d="M289 216 L651 421 L466 734 L104 528 Z" fill="url(#screen)"/>
    <g clip-path="url(#screenClip)" opacity=".72">
      <path d="M-8 512 C184 334 339 701 535 487 S886 557 1002 294" fill="none" stroke="#DDFBFF" stroke-width="34"/>
      <path d="M-5 615 C206 402 343 759 550 552 S868 647 1001 383" fill="none" stroke="#2437B7" stroke-width="48" opacity=".55"/>
      <ellipse cx="402" cy="412" rx="155" ry="62" fill="#FFFFFF" opacity=".17" transform="rotate(30 402 412)"/>
    </g>
    <path d="M289 216 L651 421 L466 734" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="8"/>
  </g>

  <!-- Hinge and base seen from the side. -->
  <ellipse cx="455" cy="753" rx="71" ry="33" fill="#070911" opacity=".8"/>
  <path d="M101 757 L654 757 L859 866 Q873 876 855 893 L146 893 Q113 886 101 860 Z" fill="url(#metal)" filter="url(#shadow)"/>
  <path d="M101 757 L654 757 L859 866 L146 866 Q116 859 101 836 Z" fill="#AEB5C8" opacity=".72"/>
  <path d="M289 757 L555 757 Q573 757 575 776 Q573 795 555 795 L289 795 Q271 795 269 776 Q271 757 289 757Z" fill="#252A39"/>
  <circle cx="454" cy="754" r="26" fill="#E3E7F2"/>
  <circle cx="454" cy="754" r="15" fill="#555C70"/>
  <path d="M149 893 L854 893" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="7" stroke-linecap="round"/>
</svg>
