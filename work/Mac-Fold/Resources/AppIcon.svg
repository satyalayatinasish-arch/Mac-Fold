<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FB"/>
      <stop offset="1" stop-color="#DDE4EB"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66747E"/>
      <stop offset=".2" stop-color="#E9F2F5"/>
      <stop offset=".55" stop-color="#A9BAC2"/>
      <stop offset=".82" stop-color="#F7FFFF"/>
      <stop offset="1" stop-color="#61717B"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9FFFF"/>
      <stop offset=".16" stop-color="#B9CBD3"/>
      <stop offset=".58" stop-color="#78909B"/>
      <stop offset="1" stop-color="#40505B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="218" fill="url(#tile)"/>
  <ellipse cx="516" cy="796" rx="378" ry="50" fill="#475660" opacity=".18"/>

  <!-- Exact side profile: a thin display folding from the rear hinge. -->
  <g filter="url(#shadow)">
    <path d="M174 717 L828 717 Q846 717 854 733 L875 771 Q880 784 862 788 L159 788 Q142 784 147 771 L161 733 Q166 717 174 717 Z" fill="url(#base)"/>
    <path d="M159 788 L862 788 Q873 790 865 804 L854 818 L168 818 L156 804 Q148 790 159 788 Z" fill="#43515B"/>
    <path d="M187 742 L822 742" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>
    <path d="M223 818 L780 818" stroke="#C7D8DF" stroke-width="7" stroke-linecap="round"/>

    <!-- Screen edge is intentionally thin, matching the provided side reference. -->
    <path d="M180 720 L195 726 L700 200 L686 189 Z" fill="url(#lid)" stroke="#4F606B" stroke-width="5" stroke-linejoin="round"/>
    <path d="M195 726 L208 730 L712 205 L700 200 Z" fill="#F9FFFF" opacity=".78"/>
    <path d="M186 720 L695 195" stroke="#0C1820" stroke-opacity=".26" stroke-width="7" stroke-linecap="round"/>
    <path d="M691 190 L700 200 L712 205 L703 194 Z" fill="#E8FAFF"/>

    <!-- Small hinge, vents, and ports make the silhouette unmistakably a MacBook. -->
    <ellipse cx="187" cy="724" rx="21" ry="15" fill="#4B5B65"/>
    <ellipse cx="187" cy="720" rx="16" ry="10" fill="#DDECEF"/>
    <rect x="267" y="748" width="58" height="10" rx="5" fill="#53636C" opacity=".85"/>
    <rect x="342" y="748" width="26" height="11" rx="5" fill="#26343D"/>
    <rect x="385" y="748" width="26" height="11" rx="5" fill="#26343D"/>
    <path d="M195 818 L195 826 L252 826 L260 818" fill="#34424B"/>
    <path d="M761 818 L769 826 L828 826 L828 818" fill="#34424B"/>
  </g>
</svg>
